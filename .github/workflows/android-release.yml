name: EgeStore - İmzalı AAB oluştur ve Google Play'e yükle

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Google Play kanalı"
        required: true
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
        default: internal

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodunu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android proje dosyalarını doğrula
        shell: bash
        run: |
          if [ ! -f android/gradlew ]; then
            echo "::error::android/gradlew bulunamadı. Önce gerçek Android Gradle projesi eklenmeli."
            exit 1
          fi
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            echo "::error::android/app Gradle yapılandırması bulunamadı."
            exit 1
          fi

      - name: İmzalama anahtarını hazırla
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::ANDROID_KEYSTORE_BASE64 secret eksik."; exit 1; }
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release.jks"
          test -s "$RUNNER_TEMP/signing/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/signing/release.jks" >> "$GITHUB_ENV"

      - name: İmzalı Release AAB derle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon bundleRelease

      - name: AAB dosyasını doğrula
        id: artifact
        shell: bash
        run: |
          AAB="$(find android -type f -path '*/build/outputs/bundle/release/*.aab' -print -quit)"
          test -n "$AAB" || { echo "::error::Release AAB bulunamadı."; exit 1; }
          echo "aab=$AAB" >> "$GITHUB_OUTPUT"

      - name: İmzalı AAB dosyasını sakla
        uses: actions/upload-artifact@v4
        with:
          name: EgeStore-release-aab
          path: ${{ steps.artifact.outputs.aab }}
          if-no-files-found: error
          retention-days: 30

      - name: Google Play'e yükle
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.PLAY_PACKAGE_NAME }}
          releaseFiles: ${{ steps.artifact.outputs.aab }}
          track: ${{ inputs.track }}
          status: draft
          changesNotSentForReview: true
